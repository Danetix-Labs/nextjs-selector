name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run check:exports

      - name: Pack tarball
        # --pack-destination does not create the directory itself.
        run: mkdir -p artifact && npm pack --pack-destination ./artifact

      - uses: actions/upload-artifact@v7
        with:
          name: package-tarball
          path: artifact/*.tgz
          retention-days: 1

  compat:
    name: Consume on Node ${{ matrix.node }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/download-artifact@v8
        with:
          name: package-tarball
          path: artifact

      - name: Install into a clean ESM consumer
        run: |
          mkdir -p consumer-esm && cd consumer-esm
          echo '{"name":"c-esm","version":"1.0.0","type":"module","private":true}' > package.json
          npm install ../artifact/*.tgz
          node -e "import('nextjs-selector').then(() => console.log('ESM import OK'))"

      - name: Install into a clean CJS consumer
        run: |
          mkdir -p consumer-cjs && cd consumer-cjs
          echo '{"name":"c-cjs","version":"1.0.0","type":"commonjs","private":true}' > package.json
          npm install ../artifact/*.tgz
          node -e "require('nextjs-selector'); console.log('CJS require OK')"

      # The /core entry carries no 'use client' and no React, so it must run in
      # an RSC runtime. This is the whole point of splitting the entry points.
      - name: Run /core under the react-server condition
        run: |
          cd consumer-esm
          node --conditions=react-server \
            -e "import('nextjs-selector/core').then(m => console.log('core executes,', Object.keys(m).length, 'exports'))"

      # The full entry is a client package: under react-server it must still
      # resolve through the `default` fallback, but executing it is not
      # expected — React withholds the hooks it needs there.
      - name: Resolve the client entry under the react-server condition
        run: |
          cd consumer-esm
          node --conditions=react-server --input-type=module \
            -e "console.log('resolved to', import.meta.resolve('nextjs-selector'))"

      - name: Import the headless entry
        run: |
          cd consumer-esm
          node -e "import('nextjs-selector/headless').then(m => console.log('headless ok:', typeof m.useSelect))"

  nextjs:
    name: Build with Next.js ${{ matrix.next }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Next 14/15 build with webpack, Next 16 defaults to Turbopack.
          - next: '14'
            react: '18.3.1'
            node: 20
          - next: '15'
            react: '19.0.0'
            node: 22
          - next: '16'
            react: '19.2.0'
            node: 24
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/download-artifact@v8
        with:
          name: package-tarball
          path: artifact

      - name: Scaffold a probe app
        run: |
          mkdir -p probe/app probe/pages && cd probe
          echo '{"name":"probe","version":"1.0.0","private":true}' > package.json
          echo 'module.exports = {}' > next.config.js

          cat > app/layout.tsx <<'TSX'
          export default function RootLayout({ children }: { children: React.ReactNode }) {
            return (
              <html lang="en">
                <body>{children}</body>
              </html>
            )
          }
          TSX

          # Client Component: exercises the browser bundle.
          cat > app/client.tsx <<'TSX'
          'use client'

          import * as pkg from 'nextjs-selector'

          export function ClientProbe() {
            return <span>client exports: {Object.keys(pkg).length}</span>
          }
          TSX

          # Server Component: exercises the RSC graph and the react-server condition.
          cat > app/page.tsx <<'TSX'
          import * as pkg from 'nextjs-selector'

          import { ClientProbe } from './client'

          export default function Page() {
            return (
              <main>
                <p>server exports: {Object.keys(pkg).length}</p>
                <ClientProbe />
              </main>
            )
          }
          TSX

          # Pages Router lives alongside the App Router here on purpose.
          cat > pages/probe.tsx <<'TSX'
          import * as pkg from 'nextjs-selector'

          export default function ProbePage() {
            return <p>pages router exports: {Object.keys(pkg).length}</p>
          }
          TSX

      - name: Install
        working-directory: probe
        run: |
          # TypeScript is pinned to 5.x: Next.js 16 rejects the TS 7 compiler API.
          npm install \
            next@${{ matrix.next }} \
            react@${{ matrix.react }} \
            react-dom@${{ matrix.react }} \
            typescript@^5.9.3 \
            @types/react @types/node \
            ../artifact/*.tgz

      - name: Build
        working-directory: probe
        run: npx next build

      - name: Build with webpack
        if: matrix.next == '16'
        working-directory: probe
        run: rm -rf .next && npx next build --webpack
